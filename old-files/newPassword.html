<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./CSS/fonts.css">
    <link rel="stylesheet" href="./CSS/general.css">
    <link rel="stylesheet" href="./CSS/menu.css">
    <link rel="stylesheet" href="./CSS/log-in.css">
    <link rel="stylesheet" href="./CSS/complements.css">

    <!-- fontawesome -->
    <link rel="stylesheet" href="./Fonts/fontawesome/css/fontawesome.css">
    <link rel="stylesheet" href="./Fonts/fontawesome/css/solid.css">
    <link rel="stylesheet" href="./Fonts/fontawesome/css/brands.css">
    <title>Nueva contraseña</title>
</head>
<body id="menu">



    <div id="page" class="log-in newPassword">
      
      <div id="main">
        
        <div class="flex-center container">

            <div class="container-form">
              
              
              <div class="row-flex div-container">
                <div class="image-form flex-center">
                  <img src="./img/Login/IMG_20230606_090748446_HDR.jpg" alt="">
                </div>

                  <div class="form-side col-flex">

                    <div>

                      <div class="container-login psrInfo">
                        <h4>Restablecer contraseña</h4>
                        <p>Ingresa una nueva contraseña</p>
                      </div>

                      <form id="passwordRecovery" method="post" class=""> 
                        <div class="container-login col-flex">   
                            <div class="col-flex fill-div">
                              <label>Contraseña: </label>   
                              <input type="password" placeholder="Contraseña" name="newPassword" id="newPassword" required> 
                            </div>
                            <div class="col-flex fill-div">
                              <label>Confirmar contraseña: </label>   
                              <input type="password" placeholder="Confirmar contraseña" name="confPassword" id="confPassword" required> 
                            </div>

                            <p class="msgAlert displayNone">Las contraseñas no coinciden</p>
                            
                            <div class="login-submit-div">
                              <button type="submit" class="next-button login-btn btn">Enviar</button>   
                            </div>
                            
                            
                        </div>   
                        
                      </form>     



                      <div class="container-login psrMsg psdChangedMsg displayNone">
                        <h4>Nueva contraseña</h4>
                        <p>Se ha reestablecido la contraseña.</p>
                        <div class="btn-div">
                          <a href="#" class="green-text-button login-btn btn btnLog">Ingresar</a>   
                        </div>
                        
                      </div>
                                                  
                    </div>



                    <div class="footer-login col-flex">
                      <a href="#">
                        <img src="./img/logo/ecoingenio-logo.svg" alt="logo ecoingenio">
                      </a>
                      <div class="socials row-flex flex-center">
                        <div class="social-icon flex-center">
                          <a href="https://www.instagram.com/ecoingeniooficial/">
                            <i class="fa-brands fa-instagram"></i>
                          </a>
                        </div>
                        <div class="social-icon flex-center">
                          <a href="https://www.facebook.com/profile.php?id=100053143827162">
                            <i class="fa-brands fa-facebook-f"></i>
                          </a>
                        </div>

                      </div>
                    </div> <!-- end footer-login -->
                  </div>

                </div>


        </div> <!-- container -->


      </div>
    </div>

    

    <!-- <script src="./Javascript/general.js"></script> -->
    <script src="./Javascript/passwordRecovery.js"></script>

</body>
</html>
