<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./CSS/fonts.css">
    <link rel="stylesheet" href="./CSS/general.css">
    <link rel="stylesheet" href="./CSS/menu.css">
    <link rel="stylesheet" href="./CSS/log-in.css">
    <link rel="stylesheet" href="./CSS/complements.css">

    <!-- fontawesome -->
    <link rel="stylesheet" href="./Fonts/fontawesome/css/fontawesome.css">
    <link rel="stylesheet" href="./Fonts/fontawesome/css/solid.css">
    <link rel="stylesheet" href="./Fonts/fontawesome/css/brands.css">
    <title>Login</title>
</head>
<body id="menu">



    <div id="page" class="log-in">
      
      <div id="main">
        
        <div class="flex-center container">

            <div class="container-form">
              
              
              <div class="row-flex div-container">
                <div class="image-form flex-center">
                  <img src="./img/Login/IMG_20230606_090748446_HDR.jpg" alt="">
                </div>

                  <div class="form-side col-flex">

                    <div class="container-login btnreg">
                      <div class="loginSelector row-flex flex-center  ">
                        <button class="btn loginBtn">Ingresar</button>
                        <button class="btn registerBtn">Registrarse</button>
                      </div>
                    </div>

                    <form id="login" method="post" class=""> 
                      <div class="container-login col-flex">   
                          <div class="col-flex fill-div">
                            <label>Email: </label>   
                            <input type="email" placeholder="Email" name="email" required> 
                          </div>
                          <div class="col-flex fill-div">
                            <label>Contraseña: </label>   
                            <input type="password" placeholder="Password" name="password" required>  
                          </div>

                          <p class="msgAlert displayNone">El usuario o la contraseña son inconrrectos</p>

                          <div class="row-flex rememberme-div">
                            <input type="checkbox" checked="checked" id="rememberme">
                            <label for="rememberme">
                              <span></span>
                              <p>Recordar</p></label> 
                          </div>
                          

                          <div class="login-submit-div">
                            <button type="submit" class="next-button login-btn btn">Entrar</button>   
                          </div>
                          
                          <div class="ftp">
                            <a href="./password-recovery.html"> Olvidaste la contraseña? </a>
                          </div>
                      </div>   
                      
                    </form>     


                    <form action="post" id="register" class="displayNone">

                      <div class="container-login col-flex">   
                        <div class="row-flex registerNames">
                          <div class="col-flex fill-div">
                            <label for="rName">Nombre: </label>   
                            <input id="rName" type="text" placeholder="Nombre" name="rName" required> 
                          </div>
                          <div class="col-flex fill-div">
                            <label for="rSName">Apellido: </label>   
                            <input id="rSName" type="text" placeholder="Apellido" name="rSName" required> 
                          </div>
                        </div>
                        <div class="col-flex fill-div">
                          <label for="rEmail">Email: </label>   
                          <input id="rEmail" type="email" placeholder="Email" name="rEmail" required> 
                        </div>
                        <div class="col-flex fill-div">
                          <label for="rPassword">Contraseña:</label>   
                          <input id="rPassword" type="password" placeholder="Password" name="password" required>  
                        </div>


                        <div class="login-submit-div">
                          <button type="submit" class="next-button login-btn btn">Registrar</button>   
                        </div>
                      </div>

                    </form>

                    <div class="login-2">
                      <p>o</p>
                      <div class="googleLogin">
                          <button class="btn ">
                            <img src="./img/socials/Google__G__Logo.svg.png" alt="">
                            <p>Continuar con Google</p>
                          </button>
                        </div>

                    </div>
  
                    <div class="footer-login col-flex">
                      <a href="./index.html">
                        <img src="./img/logo/ecoingenio-logo.svg" alt="logo ecoingenio">
                      </a>
                      <div class="socials row-flex flex-center">
                        <div class="social-icon flex-center">
                          <a href="https://www.instagram.com/ecoingeniooficial/">
                            <i class="fa-brands fa-instagram"></i>
                          </a>
                        </div>
                        <div class="social-icon flex-center">
                          <a href="https://www.facebook.com/profile.php?id=100053143827162">
                            <i class="fa-brands fa-facebook-f"></i>
                          </a>
                        </div>

                      </div>
                    </div> <!-- end footer-login -->
                  </div>

                </div>


        </div> <!-- container -->


      </div>
    </div>

    

    <!-- <script src="./Javascript/general.js"></script> -->
    <script src="./Javascript/login.js"></script>

</body>
</html>
